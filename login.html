
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>🎅 Welcome!</h1>
        <p>Get ready for the Christmas Challenge</p>
    </header>

    <main class="container">
        <h2>Enter your name</h2>

        <form id="loginForm">
            <input type="text"
                   id="playerName"
                   placeholder="Your name"
                   required>
            <button class="button" type="submit">Continue</button>
        </form>

        <p id="loginError" class="feedback"></p>
    </main>
</body>
</html>
